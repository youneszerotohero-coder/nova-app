<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <!-- The NOVA PC app's video surface (WebView2): Shaka Player, PlayReady. No
       page of the web is ever loaded here; the native host blocks navigation. -->
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; media-src blob: https:; connect-src https:; img-src 'none'">
  <title>NOVA</title>
  <style>
    html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
    /* No transform, filter or animation on the video or its ancestors:
       hardware-protected pictures are shown through a display overlay (D-148). */
    video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; background: #000; }
  </style>
</head>
<body>
  <video id="video" playsinline disablepictureinpicture disableremoteplayback controlslist="nodownload noremoteplayback"></video>
  <script src="shaka-player.compiled.js"></script>
  <script src="player.js"></script>
</body>
</html>
