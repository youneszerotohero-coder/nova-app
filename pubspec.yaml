name: nova_mobile
description: "NOVA e-learning mobile app."
publish_to: 'none'

version: 0.3.0+15

environment:
  sdk: ^3.13.3

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  # Home's date eyebrow reads the clock through it, so pictures can fix the day.
  clock: ^1.1.3
  dio: ^5.11.1
  cookie_jar: ^4.0.9
  dio_cookie_manager: ^3.5.0
  flutter_secure_storage: ^11.2.0
  file_picker: ^13.1.0
  url_launcher: ^6.3.2
  pdfx: ^2.11.0
  web_socket_channel: ^3.0.3
  livekit_client: ^2.13.0
  firebase_core: ^5.0.0
  firebase_messaging: ^17.0.0
  flutter_local_notifications: ^22.3.2
  # D-143 group chats: voice notes recorded as AAC (.m4a), voice notes and
  # the chat sounds played back, the recording's temporary file.
  record: ^7.1.2
  audioplayers: ^6.8.1
  path_provider: ^2.1.6

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:

  uses-material-design: true

  # Mock course/offer posters and portraits (sourced from the web
  # app's own assets) until covers come from /api/v1.
  assets:
    - assets/images/brand/
    - assets/images/courses/
    - assets/images/covers/
    - assets/images/packs/
    - assets/images/people/
    # D-143: the chat's send and receive sounds, synthesized for NOVA.
    - assets/sounds/

  # The website's faces (D-125 hero style): Baloo Bhaijaan 2 for titles and
  # every Arabic glyph, Geist for Latin text. Static weights instanced from
  # the OFL variable fonts (Flutter does not map FontWeight to a wght axis).
  fonts:
    - family: BalooBhaijaan2
      fonts:
        - asset: assets/fonts/BalooBhaijaan2-400.ttf
          weight: 400
        - asset: assets/fonts/BalooBhaijaan2-500.ttf
          weight: 500
        - asset: assets/fonts/BalooBhaijaan2-600.ttf
          weight: 600
        - asset: assets/fonts/BalooBhaijaan2-700.ttf
          weight: 700
        - asset: assets/fonts/BalooBhaijaan2-800.ttf
          weight: 800
    - family: Geist
      fonts:
        - asset: assets/fonts/Geist-400.ttf
          weight: 400
        - asset: assets/fonts/Geist-500.ttf
          weight: 500
        - asset: assets/fonts/Geist-600.ttf
          weight: 600
        - asset: assets/fonts/Geist-700.ttf
          weight: 700
